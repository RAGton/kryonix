# GitHub Actions workflow: bump-kryx-cli
#
# Quando você cria uma tag vX.Y.Z em RAGton/kryx-cli, este workflow:
# 1. Detecta via repository_dispatch (ou workflow_run mirror).
# 2. Faz checkout do RAGton/kryonix.
# 3. Edita flake.nix substituindo a URL do kryx-cli pela tag nova.
# 4. Roda `nix flake check` pra garantir que o flake ainda resolve.
# 5. Abre PR automático com title padronizado.
#
# Não faz push direto na main — revisão humana é obrigatória.
#
# Setup em RAGton/kryx-cli (.github/workflows/tag-notify.yml):
#   on:
#     push:
#       tags: ['v*.*.*']
#   jobs:
#     notify:
#       runs-on: ubuntu-latest
#       steps:
#         - name: Trigger kryonix bump
#           run: |
#             curl -X POST \
#               -H "Authorization: token ${{ secrets.KRYONIX_DISPATCH_TOKEN }}" \
#               -H "Accept: application/vnd.github+json" \
#               https://api.github.com/repos/RAGton/kryonix/dispatches \
#               -d "{\"event_type\":\"kryx-cli-tag\",\"client_payload\":{\"tag\":\"${GITHUB_REF_NAME}\"}}"

name: bump-kryx-cli

on:
  repository_dispatch:
    types: [kryx-cli-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do kryx-cli (ex: v0.3.3). Vazio = usar última tag."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump kryx-cli input
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout kryonix
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve target tag
        id: target
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # repository_dispatch payload: client_payload.tag
            if [ -n "${{ github.event.client_payload.tag }}" ]; then
              echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
            else
              # fallback: pega a última tag do upstream
              TAG=$(curl -s https://api.github.com/repos/RAGton/kryx-cli/releases/latest \
                | jq -r '.tag_name')
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Verify tag exists upstream
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/RAGton/kryx-cli/git/refs/tags/${TAG}")
          if [ "$HTTP" != "200" ]; then
            echo "Tag ${TAG} não existe no upstream (HTTP $HTTP)"
            exit 1
          fi

      - name: Read current version
        id: current
        run: |
          CURRENT=$(awk -F'"' '/kryx-cli = \{/ {getline; print $2}' flake.nix \
            | sed -n 's#^github:RAGton/kryx-cli/v##p')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Tag alvo: ${{ steps.target.outputs.tag }}"
          echo "Tag atual: v$CURRENT"

      - name: Patch flake.nix
        if: steps.target.outputs.tag != format('v{0}', steps.current.outputs.current)
        run: |
          TARGET="${{ steps.target.outputs.tag }}"
          TARGET_NO_V="${TARGET#v}"
          CURRENT_NO_V="${{ steps.current.outputs.current }}"
          sed -i \
            "s|github:RAGton/kryx-cli/v${CURRENT_NO_V}|github:RAGton/kryx-cli/v${TARGET_NO_V}|" \
            flake.nix
          git diff flake.nix

      - name: Validate flake
        run: |
          # Não usa nix-ga-cmd direto pq a action isola a sandbox.
          # Validação leve: parse com nix-instantiate --parse.
          nix-instantiate --parse flake.nix > /dev/null

      - name: Open PR
        if: steps.target.outputs.tag != format('v{0}', steps.current.outputs.current)
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "bump-kryx-cli/${{ steps.target.outputs.tag }}"
          title: "chore(deps): bump kryx-cli to ${{ steps.target.outputs.tag }}"
          body: |
            Automated bump of `kryx-cli` flake input.

            - Source tag: `${{ steps.target.outputs.tag }}`
            - Previous: `v${{ steps.current.outputs.current }}`
            - Trigger: repository_dispatch / workflow_dispatch
            - Reviewed by: pending human review

            After merge, downstream repos (`kryonixos`) will pick up the new
            kryx binary on next `nix flake update` + `nh os switch`.

            ---
            *Generated by `.github/workflows/bump-kryx-cli.yml`*
          add-paths: flake.nix
          commit-message: "chore(deps): bump kryx-cli to ${{ steps.target.outputs.tag }}"

      - name: Skip notice
        if: steps.target.outputs.tag == format('v{0}', steps.current.outputs.current)
        run: |
          echo "kryonix já está em ${{ steps.target.outputs.tag }}; nada a fazer."